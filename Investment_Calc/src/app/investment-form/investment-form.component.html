<form class="form-container" (ngSubmit)="onCalculateSubmit()" >
    <div class="form-group">
        <label for="principal">Initial Principal Amount ($):</label>
        <input type="number" id="principal"  name="principal" [(ngModel)]="principle" required />
    </div>
    <div class="form-group">
        <label for="rate">Annual Contribution ($):</label>
        <input type="number" id="contribution"  name="contribution" [(ngModel)]="contribution" required />
    </div>
    <div class="form-group">
        <label for="rate">Annual Interest Rate (%):</label>
        <input type="number" id="rate"  name="rate" [(ngModel)]="rate" required />
    </div>
    <div class="form-group">
        <label for="time">Time (years):</label>
        <input type="number" id="time" name="time" [(ngModel)]="time" required />
    </div>
    <button type="submit" >Calculate</button>
</form>
