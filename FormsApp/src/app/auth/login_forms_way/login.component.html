<form #form="ngForm" (ngSubmit)="onNgSubmit(form)">
  <h2>Login</h2>

  <div class="control-row">
    <div class="control no-margin">
      <label for="email">Email</label>
      <input id="email" type="email" name="email" ngModel email required #email="ngModel" />
      <!-- added #email to access the input ib below error section from teh beginning -- 
       want to get access to the control object (using ngModel) not the DOM object -->
    </div>

    <div class="control no-margin">
      <label for="password">Password</label>
      <input id="password" type="password" name="password" ngModel required minlength="6" #password="ngModel" />
    </div>

    <button class="button">Login</button>
  </div>
  <!-- @if( form.form.controls['email'].touched && form.form.controls['password'].touched && form.form.invalid){ -->
  <!-- @if( email.touched && password.touched && form.form.invalid){
  <div class="control-error">
    <p> Invalid input, please try again.</p>
  </div>
  } -->
  @if( email.touched && email.dirty && email.invalid){
  <div class="control-error">
    <p> Invalid Email address entered, please try again.</p>
  </div>
  }
  @if( password.touched && password.dirty && password.invalid){
  <div class="control-error">
    <p> Invalid Password entered, please try again.</p>
  </div>
  }
</form>
