<h2>Authenticate to access all resources</h2>
<form (ngSubmit)="onSubmit()">
  <p>
    <label>E-Mail</label>
    <input type="email" name="email" [(ngModel)]="email" />
  </p>

  <p>
    <label>Password</label>
    <input type="password" name="password" [(ngModel)]="password" />
  </p>

  <p>
    <button>Login</button>
  </p>
</form>

<div>
    <!-- <p appAuth="admin">Only admins can view this tag</p> -->
    <p *appAuth="'admin'">Only admins can view this tag</p>
    <p *appAuth="'user'" >Only users can view this tag</p>
    <p *appAuth="'guest'">Only guests can view this tag</p>
    <!-- <ng-template appAuth="admin">
        <p>Only admins can view this tag</p>
    </ng-template> -->
</div>
