<form class="form-container" (ngSubmit)="onClickAddTask()" >
    <div>
        <label for="title">Title</label>
        <input type="text" id="title" [(ngModel)]="Etitle" name="title"  />
    </div>

    <div style="position: relative;">
        <label for="time">Time</label>
        <input type="date" id="time" [(ngModel)]="Etime" name="time" style="padding-right: 35px;"/>
    </div>

    <div>
        <label for="description">Description</label>
        <textarea id="description" [(ngModel)]="Edescription" name="description" rows="3" ></textarea>
    </div>

    <div>
        <button type="submit">Add Task</button>
        <button (click)="onClickCancel()" type="button">Cancel</button>
    </div>
</form>
